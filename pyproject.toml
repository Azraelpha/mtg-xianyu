[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtg-xianyu"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "numbers-parser>=4.0",
    "httpx>=0.27",
    "Pillow>=10.0",
    "imagehash>=4.3",
    "pillow-heif>=0.18",
    "anthropic>=0.40",
    "streamlit>=1.35",
    "rapidfuzz>=3.0",
]

[project.scripts]
mtg-parse    = "mtg_xianyu.parse:main"
mtg-enrich   = "mtg_xianyu.enrich:main"
mtg-match    = "mtg_xianyu.match:main"
mtg-price    = "mtg_xianyu.price:main"
mtg-describe = "mtg_xianyu.describe:main"

[dependency-groups]
dev = [
    "playwright>=1.60.0",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_xianyu"]
